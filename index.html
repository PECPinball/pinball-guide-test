<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pinball Guide</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f3f4f6;
            color: #1f2937;
        }

        header {
            padding: 38px 20px 28px;
            text-align: center;
        }

        .page-title {
            margin-bottom: 8px;

            color: #1f2937;

            font-size: 28px;
            font-weight: bold;

            letter-spacing: 1px;
        }

        header p {
            margin: 0;

            color: #64748b;

            font-size: 15px;
        }

       .tables-container {
            display: grid;

            grid-template-columns: minmax(0, 600px);

            justify-content: center;

            gap: 24px;

            padding: 20px;
        }
        @media (max-width: 640px) {
            .tables-container {
                grid-template-columns: minmax(0, 100%);
                padding: 16px;
            }
        }

        .table-card {
            display: grid;

            grid-template-columns: minmax(0, 1fr) 230px;

            align-items: stretch;

            overflow: hidden;

            width: 100%;

            background: #ffffff;

            border: 1px solid #d1d5db;
            border-radius: 12px;

            text-decoration: none;
            color: #1f2937;

            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .table-card:hover {
            transform: translateY(-3px);

            border-color: #a78bfa;

            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.1);
        }

        .table-image {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 0;
            min-height: 90px;

            padding: 12px 20px;

            background: #e5e7eb;

            overflow: hidden;
        }
        .table-image::before {
            content: "";

            position: absolute;
            inset: 14px;

            border: 2px solid #8b5cf6;
            border-radius: 8px;

            opacity: 0.75;
        }

        .table-decoration {
            position: relative;
            z-index: 1;

            width: 100%;

            text-align: center;
        }

        .table-decoration strong {
            color: #1f2937;

            font-size: 21px;
            font-weight: bold;
            line-height: 1.1;

            text-transform: uppercase;

            overflow-wrap: anywhere;
        }

       .table-content {
    display: flex;
    flex-direction: column;

    align-items: flex-start;
    justify-content: center;

    gap: 0;

    min-width: 0;

    padding: 10px 14px;

    background: #ffffff;

    border-left: 1px solid #e5e7eb;
}

.table-content h2 {
    margin: 0;

    color: #1f2937;

    font-size: 16px;
    font-weight: bold;

    line-height: 1.2;

    overflow-wrap: anywhere;
}

.table-year {
    margin: 0;

    color: #64748b;

    font-size: 13px;
    font-weight: normal;

    line-height: 1.2;
}

.guide-badge {
    display: inline-block;

    padding: 5px 8px;

    background: #fef3c7;

    border: 1px solid #facc15;
    border-radius: 20px;

    color: #92400e;

    font-size: 10px;
    font-weight: bold;

    text-transform: uppercase;
    letter-spacing: 0.3px;

    white-space: nowrap;
}
        @media (max-width: 480px) {
            .table-card {
                grid-template-columns: minmax(0, 1fr) 145px;
            }

            .table-decoration strong {
                font-size: 17px;
            }

            .table-content {
                padding: 8px 10px;
            }

            .table-content h2 {
                font-size: 14px;
            }

            .table-year {
                font-size: 12px;
            }

            .guide-badge {
                font-size: 9px;
                padding: 4px 6px;
            }
        }
       .table-card:hover .guide-badge {
            background: #fef3c7;
            border-color: #facc15;
            color: #92400e;
        }
    </style>
</head>

<body>

     <header>
    <div class="page-title">
        PINBALL GUIDES VIEWER
    </div>

        <p>
            Sélectionnez une table pour découvrir ses règles, ses modes et ses objectifs.
        </p>
    </header>

    <main class="tables-container" id="tablesContainer">
    </main>

</body>
<script>
    async function LoadTables()
    {
        const response = await fetch("tables.json");

        if (!response.ok)
        {
            throw new Error(
                "Impossible de charger tables.json. HTTP " +
                response.status
            );
        }

        const data = await response.json();

        const container =
            document.getElementById("tablesContainer");

        data.tables.forEach(table =>
        {
            const card =
                document.createElement("a");

            card.className = "table-card";

            card.href =
                "viewer?guide=guide/" + table.guide;

         card.innerHTML = `
    <div class="table-image">
        <div class="table-decoration">
            <strong>${table.title}</strong>
        </div>
    </div>

    <div class="table-content">
        <h2>${table.manufacturer}</h2>

        <p class="table-year">
            ${table.year}
        </p>

        <span class="guide-badge">
             ${table.state}
        </span>
    </div>
`;

            container.appendChild(card);
        });
    }

    LoadTables().catch(error =>
    {
        console.error(
            "Impossible de charger la liste des tables :",
            error
        );
    });
</script>
</html>
